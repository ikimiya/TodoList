<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- Login Form -->
    <div id="loginForm" class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-4">📝 TodoList</h3>
                    <div id="loginError" class="alert alert-danger d-none"></div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="Enter email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password">
                    </div>
                    <button onclick="login()" class="btn btn-primary w-100">Login</button>

                    <div class="text-center mt-3">
                        <a href="#" onclick="showRegister()">Don't have an account? Register</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="row justify-content-center mt-5 d-none">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-4">📝 Register</h3>
                    <div id="registerError" class="alert alert-danger d-none"></div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="registerEmail" class="form-control" placeholder="Enter email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="registerPassword" class="form-control" placeholder="Enter password">
                    </div>
                    <button onclick="register()" class="btn btn-primary w-100">Register</button>

                    <div class="text-center mt-3">
                        <a href="#" onclick="showLogin()">Already have an account? Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/tasks.html';
        }

        function showRegister() {
            document.getElementById('loginForm').classList.add('d-none');
            document.getElementById('registerForm').classList.remove('d-none');
        }

        function showLogin() {
            document.getElementById('registerForm').classList.add('d-none');
            document.getElementById('loginForm').classList.remove('d-none');
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const response = await fetch('/api/AuthApi/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.token);
                window.location.href = '/tasks.html';
            } else {
                const error = document.getElementById('loginError');
                error.textContent = 'Invalid email or password';
                error.classList.remove('d-none');
            }
        }

        async function register() {
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            const response = await fetch('/api/AuthApi/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                showLogin();
            } else {
                const error = document.getElementById('registerError');
                error.textContent = 'Email already exists';
                error.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
