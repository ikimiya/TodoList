<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand">📝 TodoList</a>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">Logout</button>
        </div>
    </nav>

    <div class="container">

        <!-- Create Category -->
        <div class="card shadow mb-4">
            <div class="card-body">
                <h5 class="card-title">Create Category</h5>
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="categoryName" class="form-control" placeholder="Category name">
                    </div>
                    <div class="col-md-2">
                        <button onclick="createCategory()" class="btn btn-success w-100">Add Category</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Create Task -->
        <div class="card shadow mb-4">
            <div class="card-body">
                <h5 class="card-title">Create New Task</h5>
                <div class="row g-2">
                    <div class="col-md-3">
                        <input type="text" id="taskTitle" class="form-control" placeholder="Task title">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="taskDescription" class="form-control" placeholder="Description">
                    </div>
                    <div class="col-md-2">
                        <select id="taskPriority" class="form-select">
                            <option value="0">Low</option>
                            <option value="1">Medium</option>
                            <option value="2">High</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select id="taskCategory" class="form-select">
                            <option value="">Select Category</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button onclick="createTask()" class="btn btn-primary w-100">Add Task</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
                <a class="nav-link active" onclick="showTab('active')" id="activeTab">Active Tasks</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" onclick="showTab('deleted')" id="deletedTab">Deleted Tasks</a>
            </li>
        </ul>

        <!-- Active Tasks -->
        <div id="activeTasks" class="card shadow">
            <div class="card-body">
                <div id="tasksList"></div>
            </div>
        </div>

        <!-- Deleted Tasks -->
        <div id="deletedTasks" class="card shadow d-none">
            <div class="card-body">
                <div id="deletedList"></div>
            </div>
        </div>

    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/index.html';

        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        };

        window.onload = async () => {
            await loadCategories();
            await loadTasks();
        }

        function showTab(tab) {
            if (tab === 'active') {
                document.getElementById('activeTasks').classList.remove('d-none');
                document.getElementById('deletedTasks').classList.add('d-none');
                document.getElementById('activeTab').classList.add('active');
                document.getElementById('deletedTab').classList.remove('active');
                loadTasks();
            } else {
                document.getElementById('activeTasks').classList.add('d-none');
                document.getElementById('deletedTasks').classList.remove('d-none');
                document.getElementById('activeTab').classList.remove('active');
                document.getElementById('deletedTab').classList.add('active');
                loadDeletedTasks();
            }
        }

        async function loadTasks() {
            const response = await fetch('/Tasks', { headers });
            const tasks = await response.json();
            const list = document.getElementById('tasksList');

            if (tasks.length === 0) {
                list.innerHTML = '<p class="text-muted">No tasks yet. Create one above!</p>';
                return;
            }

            list.innerHTML = tasks.map(task => `
                    <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                        <div>
                            <strong>${task.title}</strong>
                            <span class="badge ${priorityBadge(task.priority)} ms-2">${priorityLabel(task.priority)}</span>
                            <span class="badge ${statusBadge(task.status)} ms-2">${statusLabel(task.status)}</span>
                            <p class="text-muted mb-0 small">${task.description || ''}</p>
                        </div>
                        <button onclick="deleteTask(${task.id})" class="btn btn-danger btn-sm">Delete</button>
                    </div>
                `).join('');
        }

        async function loadDeletedTasks() {
            const response = await fetch('/Tasks/deleted', { headers });
            const tasks = await response.json();
            const list = document.getElementById('deletedList');

            if (tasks.length === 0) {
                list.innerHTML = '<p class="text-muted">No deleted tasks.</p>';
                return;
            }

            list.innerHTML = tasks.map(task => `
                    <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                        <div>
                            <strong>${task.title}</strong>
                            <span class="badge bg-secondary ms-2">Deleted</span>
                            <p class="text-muted mb-0 small">Deleted at: ${new Date(task.deletedAt).toLocaleDateString()}</p>
                        </div>
                    </div>
                `).join('');
        }

        async function loadCategories() {
            const response = await fetch('/Categories', { headers });
            const categories = await response.json();
            const select = document.getElementById('taskCategory');
            select.innerHTML = '<option value="">Select Category</option>';
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
        }

        async function createCategory() {
            const name = document.getElementById('categoryName').value;
            if (!name) { alert('Please enter a category name'); return; }

            const response = await fetch('/Categories', {
                method: 'POST',
                headers,
                body: JSON.stringify({ name })
            });

            if (response.ok) {
                document.getElementById('categoryName').value = '';
                await loadCategories();
            } else {
                const error = await response.text();
                alert(error);
            }
        }

        async function createTask() {
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const priority = parseInt(document.getElementById('taskPriority').value);
            const categoryId = parseInt(document.getElementById('taskCategory').value);

            if (!title) { alert('Please enter a task title'); return; }
            if (!categoryId) { alert('Please select a category'); return; }

            const response = await fetch('/Tasks', {
                method: 'POST',
                headers,
                body: JSON.stringify({ title, description, priority, categoryId, status: 0 })
            });

            if (response.ok) {
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskDescription').value = '';
                await loadTasks();
            } else {
                alert('Failed to create task');
            }
        }

        async function deleteTask(id) {
            if (!confirm('Delete this task?')) return;

            const response = await fetch(`/Tasks/${id}`, {
                method: 'DELETE',
                headers
            });

            if (response.ok) await loadTasks();
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/index.html';
        }

        function priorityLabel(p) { return ['Low', 'Medium', 'High'][p] || 'Low'; }
        function priorityBadge(p) { return ['bg-success', 'bg-warning', 'bg-danger'][p] || 'bg-success'; }
        function statusLabel(s) { return ['Pending', 'In Progress', 'Completed'][s] || 'Pending'; }
        function statusBadge(s) { return ['bg-secondary', 'bg-primary', 'bg-success'][s] || 'bg-secondary'; }
    </script>
</body>
</html>
